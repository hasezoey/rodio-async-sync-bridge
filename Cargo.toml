[package]
name = "rodio-async-sync-bridge"
version = "0.1.0"
authors = ["hasezoey <hasezoey@gmail.com>"]
edition = "2024"
# should always match rodio's minimum supported Rust version;
# or the highest of any direct, non-optional dependency's minimum supported Rust version
rust-version = "1.88"
license = "MIT"
description = "A bridge for rodio from async to sync"

[features]
default = ["symphonia"]
# Enable "From" conversion from Symphonia's `AudioSpec` to this crate's `AudioSpec`.
symphonia = ["dep:symphonia"]

[dependencies]
log = "0.4.27"
rodio = { version = "0.22", default-features = false, features = [] }
async-ringbuf = "0.3.6"
parking_lot = "^0.12.5"
tokio = { version = "1.52", default-features = false, features = ["rt", "sync"] }
symphonia = { version = "0.6.0", optional = true, default-features = false }

[dev-dependencies]
pretty_assertions = "1.4.1"
criterion = "0.8"
tokio = { version = "1.52", features = ["sync", "macros", "rt", "rt-multi-thread", "parking_lot", "process", "time"] }

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
needless_return = "allow"
implicit_return = "deny"
needless_doctest_main = "allow"
tabs_in_doc_comments = "allow"
wildcard_imports = "warn"
semicolon_if_nothing_returned = "warn"
default_trait_access = "warn"
manual_assert = "warn"
map_unwrap_or = "warn"
ignored_unit_patterns = "warn"
manual_let_else = "warn"
single_match_else = "warn"
if_not_else = "warn"
manual_string_new = "warn"
used_underscore_binding = "warn"
return_self_not_must_use = "warn"
inefficient_to_string = "warn"

[[bench]]
name = "async_ring"
harness = false
