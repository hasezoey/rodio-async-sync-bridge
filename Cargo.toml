[package]
name = "rodio-async-sync-bridge"
version = "0.1.0"
authors = ["hasezoey <hasezoey@gmail.com>"]
edition = "2024"
rust-version = "1.87" # should always match rodio's minimum supported Rust version
license = "MIT"

[dependencies]
log = "0.4.27"
rodio = { version = "0.22", default-features = false, features = []}
async-ringbuf = "0.3.6"

[dev-dependencies]
pretty_assertions = "1.4.1"
criterion = "0.8"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
needless_return = "allow"
implicit_return = "deny"
needless_doctest_main = "allow"
tabs_in_doc_comments = "allow"
wildcard_imports = "warn"
semicolon_if_nothing_returned = "warn"
default_trait_access = "warn"
manual_assert = "warn"
map_unwrap_or = "warn"
ignored_unit_patterns = "warn"
manual_let_else = "warn"
single_match_else = "warn"
if_not_else = "warn"
manual_string_new = "warn"
used_underscore_binding = "warn"
return_self_not_must_use = "warn"
inefficient_to_string = "warn"
